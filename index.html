<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="./manifest.json">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GranBoard 3D Training Pro</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Three.js für 3D Grafiken -->
    <script src="https://cloudflare.com"></script>


    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(22, 27, 46, 0.85);
            --accent-cyan: #00f0ff;
            --accent-green: #39ff14;
            --accent-gold: #ffaa00;
            --text-light: #f0f4f8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

body {
    font-family: 'Rajdhani', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
    height: 100vh;
    overflow: hidden;
    display: block;
    position: relative;
}

/* --- 3D CANVAS BACKGROUND --- */
#canvas3d-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    background: radial-gradient(circle at center, #1b223c 0%, #07090f 100%);
    z-index: 1;
}

.sidebar {
  position: fixed;
  top: 0;
  left: -500px; /* KORREKTUR: Startet komplett unsichtbar außerhalb des linken Rands */
  width: 500px;
  height: 100vh;
  background: rgba(10, 13, 26, 0.96);
  backdrop-filter: blur(10px);
  border-right: 2px solid var(--accent-cyan);
  padding: 20px 25px 15px 25px;
  box-sizing: border-box;
  z-index: 1000;
  transition: left 0.3s ease-in-out;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  box-shadow: 5px 0 25px rgba(0, 240, 255, 0.2);
}


/* Der neue pulsierende Neon-Blinkeffekt für deinen Namen */
@keyframes neonPulse {
  0% { text-shadow: 0 0 4px rgba(0,240,255,0.6), 0 0 10px rgba(0,240,255,0.4); opacity: 1; }
  50% { text-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-cyan); opacity: 0.85; }
  100% { text-shadow: 0 0 4px rgba(0,240,255,0.6), 0 0 10px rgba(0,240,255,0.4); opacity: 1; }
}

.blink-neon {
  animation: neonPulse 2s infinite ease-in-out;
  color: var(--accent-cyan);
  font-weight: 900;
}


/* WICHTIG: Falls es eine .sidebar.open Klasse gibt, stelle sicher, dass sie so aussieht: */
.sidebar.open {
  left: 0px !important;
}


/* 📱 AUTOMATISCHE ANPASSUNG FÜR SMARTPHONES (Querformat / Landscape) */
@media screen and (max-width: 896px) and (orientation: landscape) {
 .sidebar {
 width: 260px; /* Schmalere Sidebar auf dem Handy, damit mehr Platz für das 3D Board bleibt */
 padding: 10px;
 gap: 8px;
 }
 .sidebar h1 {
 font-size: 16px; /* Kleinere Überschrift */
 margin-bottom: 5px;
 }
 .section-box {
 padding: 8px; /* Kompaktere Boxen */
 }
 select, input, button {
 padding: 8px;
 font-size: 12px; /* Kleinere Schrift für Felder auf dem Handy */
 margin-bottom: 6px;
 }
 .settings-toggle-btn {
 left: 275px !important; /* Menü-Button rückt näher heran */
 padding: 6px 12px;
 font-size: 13px;
 }
}

/* 📑 AUTOMATISCHE ANPASSUNG FÜR TABLETS (z.B. iPad / Samsung Galaxy Tab) */
@media screen and (min-width: 897px) and (max-width: 1280px) {
 .sidebar {
 width: 320px; /* Mittlere Breite für Tablets */
 padding: 15px;
 }
 .settings-toggle-btn {
 left: 335px !important;
 }
}


.settings-toggle-btn {
 position: absolute;
 top: 25px; 
 left: 405px; /* Bleibt rechts neben der Sidebar */
 width: auto; /* Wächst automatisch mit dem Text mit */
 height: auto;
 background: rgba(22, 27, 46, 0.9);
 border: 2px solid var(--accent-cyan);
 color: var(--accent-cyan);
 border-radius: 6px; /* Schön abgerundete Ecken statt Kreis */
 padding: 10px 18px; /* Innenabstand für den Text */
 display: flex; align-items: center; justify-content: center;
 gap: 8px; /* Abstand zwischen dem Zahnrad und dem Wort "MENÜ" */
 font-family: 'Orbitron', sans-serif;
 font-size: 16px; 
 font-weight: bold;
 letter-spacing: 1px;
 cursor: pointer; pointer-events: auto;
 box-shadow: 0 0 15px rgba(0,240,255,0.3);
 transition: all 0.3s;
 z-index: 150;
}


.settings-toggle-btn:hover {
    transform: rotate(45deg) scale(1.1);
    box-shadow: 0 0 25px var(--accent-cyan);
}


        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }



@keyframes pulse {
    from { opacity: 0.4; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1.1); }
}


        h1 {
            font-size: 20px;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0,240,255,0.4);
            text-align: center;
            margin-bottom: 10px;
        }

        .section-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
        }

        .section-title {
            font-size: 14px;
            color: var(--accent-gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Elements */
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        select, input, button {
            width: 100%;
            background: #111424;
            border: 1px solid #2d3559;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        select:focus, input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0,240,255,0.3);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #0055ff 0%, #00d2ff 100%);
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,210,255,0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #009900 0%, #39ff14 100%);
            border: none; color: #000; font-weight: bold; cursor: pointer;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Members / Player Selection */
        .member-entry {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }
        .member-checkbox { width: auto; margin: 0; }

        /* --- OVERLAYS ON 3D CANVAS --- */
        .hud-overlay {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            padding: 25px;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bt-status {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ff3333;
            color: #ff3333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bt-status.connected {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 10px rgba(57,255,20,0.3);
        }

        /* Giant Scoreboard for current player */
        .main-score-panel {
            background: rgba(5, 7, 15, 0.8);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-width: 250px;
            box-shadow: 0 0 30px rgba(0,240,255,0.2);
        }
        .active-player-name {
            font-size: 24px;
            color: #fff;
            font-weight: bold;
        }
        .giant-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            color: var(--accent-green);
            text-shadow: 0 0 20px rgba(57,255,20,0.5);
            line-height: 1;
            margin: 10px 0;
        }

        /* Darts Thrown in current Turn */
        .dart-turn-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .dart-icon {
            font-size: 20px;
            color: #444;
            text-shadow: none;
            transition: all 0.3s;
        }
        .dart-icon.active {
            color: var(--accent-gold);
            text-shadow: 0 0 8px var(--accent-gold);
        }

        /* Banner for Next Player / Pull Darts */
        #action-banner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff0055 0%, #990000 100%);
            padding: 20px 50px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            border: 3px solid #ff3333;
            box-shadow: 0 0 40px rgba(255,0,85,0.6);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        #action-banner.show { transform: translate(-50%, -50%) scale(1); }

        /* Player Rotation Grid at bottom */
        .hud-bottom {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            width: 100%;
        }
        .player-card {
            background: rgba(10,15,30,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 6px;
            min-width: 140px;
            text-align: center;
            transition: all 0.3s;
        }
        .player-card.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0,240,255,0.3);
            transform: translateY(-5px);
        }
        .player-card .p-name { font-weight: bold; font-size: 16px; }
        .player-card .p-score { font-family: 'Orbitron', sans-serif; color: var(--accent-cyan); font-size: 20px; }
   

/* Riesiges Treffer-Pop-up mit solidem Kasten-Hintergrund */
.hit-popup {
 position: fixed;
 top: 50%;
 left: 50%;
 /* Startzustand: Nach unten verschoben, klein und unsichtbar */
 transform: translate(-50%, -20%) scale(0.1);
 font-family: 'Orbitron', sans-serif;
 font-size: 200px; /* Perfekte Größe, damit der Kasten nicht den ganzen Bildschirm blockiert */
 font-weight: 900;
 color: #39ff14; /* Pures, sattes Neongrün */
 
 /* DER KASTEN: Komplett blickdicht (0.95), extrem dunkel mit Cyberpunk-Rahmen */
 background: rgba(5, 7, 15, 0.98); 
 border: 4px solid #00f0ff; /* Stechender, cyanfarbener Rahmen */
 border-radius: 20px;
 padding: 20px 60px;
 min-width: 450px;
 text-align: center;
 
 /* Extreme Leuchteffekte für Rahmen und Text für maximale Sichtbarkeit */
 box-shadow: 0 0 50px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3);
 text-shadow: 0 0 25px rgba(57, 255, 20, 1), 0 0 50px rgba(57, 255, 20, 0.8);
 
 z-index: 99999; /* Überlagert absolut alles */
 pointer-events: none;
 opacity: 0;
 transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Zielzustand: Schießt voll deckend in den Fokus */
.hit-popup.show {
 opacity: 1 !important;
 transform: translate(-50%, -50%) scale(1);
}




/* --- OVERLAY FENSTER FÜR SPIELERAUSWAHL --- */
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(5, 7, 15, 0.85);
    backdrop-filter: blur(8px);
    display: none; /* Standardmäßig unsichtbar */
    justify-content: center; align-items: center;
    z-index: 2000;
}
.modal-overlay.open { display: flex; }
.modal-content {
    background: rgba(10, 14, 28, 0.99); /* Dunkler, edler Cyberpunk-Hintergrund */
    border: 3px solid var(--accent-cyan);
    box-shadow: 0 0 50px rgba(0,240,255,0.5);
    border-radius: 16px;
    width: 95vw; /* Nutzt 95% der gesamten Bildschirmbreite */
    height: 90vh; /* Nutzt 90% der gesamten Bildschirmhöhe */
    max-height: 90vh;
    padding: 35px;
    display: flex; 
    flex-direction: column;
    font-family: 'Orbitron', sans-serif;
}

.modal-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 12px; margin-bottom: 15px;
}
.modal-body {
 overflow-y: auto;
 flex-grow: 1;
 padding-right: 5px;
 margin-bottom: 20px;
}

.open-targets-hint {
 font-size: 2vw; /* Passt sich der Bildschirmbreite an */
 min-font-size: 16px; /* Verhindert, dass es auf sehr kleinen Handys unlesbar klein wird */
 color: var(--accent-cyan);
 opacity: 0.95;
 margin-top: 1vh;
 text-align: left;
 letter-spacing: 1px;
}
.open-targets-hint strong {
 color: var(--accent-gold);
 text-shadow: 0 0 10px rgba(255,170,0,0.3);
}
/* Klasse für Zahlen, die bei allen Gegnern bereits zu sind */
.target-blocked {
 color: #ff3333 !important;
 text-shadow: 0 0 10px rgba(255,51,51,0.5) !important;
 text-decoration: line-through;
}



/* 1. Blinkender Neon-Pfeil (für Soft Cricket) */
.active-arrow-neon {
 display: inline-block;
 font-size: 3.5vw;
 color: var(--accent-cyan);
 margin-left: 15px;
 vertical-align: middle;
 text-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
 animation: neonBlink 1s ease-in-out infinite alternate;
}
@keyframes neonBlink {
 0% { opacity: 0.2; text-shadow: 0 0 2px var(--accent-cyan); }
 100% { opacity: 1; text-shadow: 0 0 15px var(--accent-cyan), 0 0 25px #00f0ff; }
}

/* 2. Animiertes 3D-Monster (für Monster Cricket) */
.monster-icon-3d {
 display: inline-block;
 font-size: 4.5vw;
 margin-left: 15px;
 vertical-align: middle;
 filter: drop-shadow(0 0 15px #ff0055);
 animation: monsterBreath 3s ease-in-out infinite alternate, monsterFloat 4s ease-in-out infinite alternate;
 transform-style: preserve-3d;
 perspective: 500px;
}
@keyframes monsterBreath {
 0% { transform: scale(1) rotateX(0deg) rotateY(0deg); filter: drop-shadow(0 0 10px #ff0055); }
 100% { transform: scale(1.12) rotateX(10deg) rotateY(-5deg); filter: drop-shadow(0 0 25px #ffaa00); }
}
@keyframes monsterFloat {
 0% { transform: translateY(0px); }
 100% { transform: translateY(-8px); }
}



/* Split Score Explosionsoverlay */
/* Split Score Explosionsoverlay - WUCHTIGER & LANGSAMER */
.split-explosion-overlay {
 position: fixed;
 top: 0; left: 0;
 width: 100vw; height: 100vh;
 background: rgba(20, 0, 5, 0.93); /* Dunkler, damit die Zahl extrem heraussticht */
 display: flex; justify-content: center; align-items: center;
 z-index: 9999;
 backdrop-filter: blur(25px); /* Stärkerer Weichzeichner im Hintergrund */
 font-family: 'Orbitron', sans-serif;
 pointer-events: none;
 animation: flashBackground 2.0s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
}
.explosion-number {
 font-size: 8vw; /* Etwas kompakter, damit der Text garantiert nicht abschneidet */
 font-weight: 900;
 color: #ff2233;
 text-align: center;
 line-height: 1.2;
 text-shadow: 0 0 30px #ff0044, 0 0 60px #ff0044, 0 0 100px #ff0044;
 animation: shatterText 2.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes flashBackground {
 0% { background: rgba(255, 0, 40, 0.85); }
 15% { background: rgba(15, 3, 8, 0.95); }
 90% { opacity: 1; }
 100% { opacity: 0; } /* Blendet am Ende weich aus */
}
@keyframes shatterText {
 0% { transform: scale(0.2) rotate(-5deg); opacity: 0; }
 10% { transform: scale(1.2) rotate(3deg); opacity: 1; }
 20% { transform: scale(1.0) rotate(0deg); }
 75% { transform: scale(1.15) rotate(1deg); opacity: 1; filter: blur(0px); }
 100% { transform: scale(1.8); opacity: 0; filter: blur(20px); }
}


/* Blinkender Team-Sperrhinweis */
.team-lock-warning {
    background: rgba(255, 0, 0, 0.2);
    border: 2px solid #ff3333;
    color: #ff3333;
    padding: 10px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin-top: 15px;
    text-shadow: 0 0 10px #ff3333;
    animation: lockFlash 0.6s infinite alternate;
}
@keyframes lockFlash {
    0% { opacity: 0.3; box-shadow: 0 0 5px rgba(255,51,51,0.2); }
    100% { opacity: 1; box-shadow: 0 0 20px rgba(255,51,51,0.6); }
}



</style>
</head>









<body>
<!-- BESCHRIFTETER MENÜ-TRIGGERKNOPF (RECHTSBÜNDIG) -->
<div class="settings-toggle-btn" onclick="toggleSettingsMenu()" style="position: absolute; top: 20px; right: 30px; left: auto; background: rgba(0, 240, 255, 0.1); border: 2px solid var(--accent-cyan); color: var(--accent-cyan); padding: 10px 24px; font-family: 'Orbitron'; font-weight: 900; font-size: 16px; border-radius: 8px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); transition: all 0.3s ease; z-index: 1000; width: auto; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.background='rgba(0, 240, 255, 0.25)'; this.style.boxShadow='0 0 25px rgba(0, 240, 255, 0.5)';" onmouseout="this.style.background='rgba(0, 240, 255, 0.1)'; this.style.boxShadow='0 0 15px rgba(0, 240, 255, 0.2)';">
  <i class="fa-solid fa-gear"></i> MENÜ
</div>









 <!-- DIE SIDEBAR -->
 <div class="sidebar open" id="sliding-settings-menu" style="left: 0px; padding: 20px 25px 15px 25px;">
   
   <!-- TOP-BAR: Maximale Breite, kein Quetschen mehr -->
   <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 15px; gap: 15px; width: 100%;">
     
     <!-- Menü schließen -->
     <button onclick="toggleSettingsMenu()" style="background: transparent; border: 2px solid var(--accent-cyan); color: var(--accent-cyan); font-size: 15px; padding: 7px 14px; border-radius: 6px; cursor: pointer; transition: all 0.3s; font-family: 'Orbitron', sans-serif; font-weight: 900; white-space: nowrap;">
       ◀ MENÜ
     </button>
     
     <!-- NEU: Rosis fetter, blinkender Titel -->
     <div style="text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; line-height: 1.1;">
       <span class="blink-neon" style="font-size: 22px; letter-spacing: 1.5px;">GRANBOARD</span>
       <span style="font-size: 13px; color: var(--accent-gold); font-weight: bold; letter-spacing: 3px; margin-top: 2px; text-transform: uppercase;">by Rosi</span>
     </div>
     
     <!-- Board verbinden (Hat jetzt massig Platz!) -->
     <button id="btnConnect" style="background: rgba(0, 85, 255, 0.25); border: 2px solid #00d2ff; color: #00d2ff; font-size: 14px; padding: 7px 14px; border-radius: 6px; cursor: pointer; transition: all 0.3s; font-family: 'Orbitron', sans-serif; font-weight: 900; white-space: nowrap;"
             onmouseover="this.style.background='rgba(0, 210, 255, 0.4)'; this.style.boxShadow='0 0 12px #00d2ff';" 
             onmouseout="this.style.background='rgba(0, 85, 255, 0.25)'; this.style.boxShadow='none';">
       CONNECT BT
     </button>
   </div>


   <!-- 1. TRAINING-SETUP (Größere Beschriftungen & Boxen) -->
   <div class="section-box" id="setup-panel" style="margin-bottom: 18px; padding: 15px 18px;">
     <div class="section-title" style="font-size: 16px; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;"><i class="fa-solid fa-sliders"></i> Training-Setup</div>
     
     <label style="font-size: 14px; margin-bottom: 6px; font-weight: bold; color: #aaa;">Spielmodus</label>
     <select id="game-mode" onchange="toggleGameModeOptions()" style="padding: 10px; font-size: 16px; margin-bottom: 14px; font-family: 'Orbitron', sans-serif; font-weight: bold;">
       <option value="x01">301 - 1001 (Einzelspieler)</option>
       <option value="x01_teams">301 - 1001 (Team-Modus)</option>
       <option value="cricket">Klassik Cricket (15 - Bull)</option>
       <option value="maxicricket">Maxi Cricket (10 - Bull)</option>
       <option value="split">Split Score</option>
     </select>
     
     <!-- X01 OPTIONEN -->
     <div id="x01-options">
       <label style="font-size: 14px; margin-bottom: 6px; font-weight: bold; color: #aaa;">Punkte-Ziel</label>
       <select id="x01-target" style="padding: 10px; font-size: 16px; margin-bottom: 14px; font-family: 'Orbitron', sans-serif;">
         <option value="301">301</option>
         <option value="501" selected>501</option>
         <option value="701">701</option>
         <option value="1001">1001</option>
       </select>
       <label style="font-size: 14px; margin-bottom: 6px; font-weight: bold; color: #aaa;">Einwurf (In)</label>
       <select id="x01-in" style="padding: 10px; font-size: 16px; margin-bottom: 14px; font-family: 'Orbitron', sans-serif;">
         <option value="open">Open In</option>
         <option value="double">Double In</option>
         <option value="master">Master In</option>
       </select>
       <label style="font-size: 14px; margin-bottom: 6px; font-weight: bold; color: #aaa;">Auswurf (Out)</label>
       <select id="x01-out" style="padding: 10px; font-size: 16px; margin-bottom: 6px; font-family: 'Orbitron', sans-serif;">
         <option value="open">Open Out</option>
         <option value="double" selected>Double Out</option>

// Funktion, um den Text aus der Textbox in echte Spieldaten umzuwandeln
function aktualisiereMembersDataAusText(text) {
  const zeilen = text.split('\n');
  membersData = [];
  let aktuellerId = 0;

  zeilen.forEach(zeile => {
    const bereinigterName = zeile.trim();
    if (bereinigterName !== "") {
      membersData.push({
        id: aktuellerId,
        name: bereinigterName,
        x01: 0, cricket: 0, maxicricket: 0, split: 0
      });
      aktuellerId++;
    }
  });
}

}

// Zentrale Klick-Logik: Erkennt automatisch, ob Einzel- oder Teammodus aktiv ist
function handlePlayerCardClick(idx) {
 const checkbox = document.getElementById(`mem-${idx}`);
 const teamSelect = document.getElementById(`team-select-${idx}`);
 if (!checkbox || !teamSelect) return;

 // Spielmodus aus dem Hauptmenü auslesen
 const gameMode = document.getElementById('game-mode')?.value || 'x01';
 const isTeamMode = (gameMode === 'x01_teams');

 let isChecked = checkbox.checked;
 let currentTeam = parseInt(teamSelect.value);

 if (!isTeamMode) {
   // --- EINZELSPIELER-LOGIK ---
   // Wechselt einfach nur zwischen Aktiv (immer Team 1 im Hintergrund) und Inaktiv
   checkbox.checked = !isChecked;
   teamSelect.value = "1"; 
 } else {
   // --- TEAM-LOGIK ---
   // Rotiert wie gewohnt durch Teams (1 bis 5), danach wieder Inaktiv
   if (!isChecked) {
     checkbox.checked = true;
     teamSelect.value = "1";
   } else {
     if (currentTeam < 5) {
       teamSelect.value = (currentTeam + 1).toString();
     } else {
       checkbox.checked = false;
       teamSelect.value = "1";
     }
   }
 }

 // Optik sofort anpassen und Start-Button prüfen
 updateCardVisuals(idx);
 checkStartButtonLive();
}

// Hilfsfunktion zur Zuweisung der Farben (berücksichtigt Einzel- vs. Teammodus)
function updateCardVisuals(idx) {
 const checkbox = document.getElementById(`mem-${idx}`);
 const teamSelect = document.getElementById(`team-select-${idx}`);
 const visualBox = document.getElementById(`visual-box-${idx}`);
 const badge = document.getElementById(`team-badge-${idx}`);
 const nameDisplay = document.getElementById(`name-display-${idx}`);

 if (!checkbox || !teamSelect || !visualBox || !badge || !nameDisplay) return;

 // Spielmodus auslesen
 const gameMode = document.getElementById('game-mode')?.value || 'x01';
 const isTeamMode = (gameMode === 'x01_teams');

 if (!checkbox.checked) {
   // Inaktiver Zustand (Dunkel, dezenter Rahmen)
   visualBox.style.background = "rgba(255,255,255,0.02)";
   visualBox.style.border = "1px solid rgba(255,255,255,0.1)";
   visualBox.style.boxShadow = "none";
   nameDisplay.style.color = "#888";
   nameDisplay.style.textShadow = "none";
   badge.innerText = "STANDBY";
   badge.style.color = "#555";
 } else {
   // Aktiver Zustand
   nameDisplay.style.color = "#ffffff";
   nameDisplay.style.textShadow = "0 0 8px rgba(255,255,255,0.5)";
   
   if (!isTeamMode) {
     // --- OPTIK FÜR EINZELSPIELER ---
     let activeColor = "#00f0ff"; // Klares Cyberpunk-Cyan
     visualBox.style.background = "rgba(0, 240, 255, 0.15)";
     visualBox.style.border = `2px solid ${activeColor}`;
     visualBox.style.boxShadow = `0 0 15px ${activeColor}44`;
     badge.innerText = "SPIELER AKTIV";
     badge.style.color = activeColor;
   } else {
     // --- OPTIK FÜR TEAMS 1-5 ---
     let currentTeam = teamSelect.value;
     let teamColor = "#00f0ff";
     let bgColor = "rgba(0, 240, 255, 0.12)";
     
     switch(currentTeam) {
       case "1":
         teamColor = "#00f0ff"; // Neon Cyan
         bgColor = "rgba(0, 240, 255, 0.12)";
         break;
       case "2":
         teamColor = "#39ff14"; // Neon Grün
         bgColor = "rgba(57, 255, 20, 0.12)";
         break;
       case "3":
         teamColor = "#ffaa00"; // Neon Gold
         bgColor = "rgba(255, 170, 0, 0.12)";
         break;
       case "4":
         teamColor = "#ff0055"; // Neon Pink/Rot
         bgColor = "rgba(255, 0, 85, 0.12)";
         break;
       case "5":
         teamColor = "#b026ff"; // Neon Violett
         bgColor = "rgba(176, 38, 255, 0.12)";
         break;
     }
     
     visualBox.style.background = bgColor;
     visualBox.style.border = `2px solid ${teamColor}`;
     visualBox.style.boxShadow = `0 0 15px ${teamColor}44`;
     badge.innerText = `TEAM ${currentTeam}`;
     badge.style.color = teamColor;
   }

let touchTimer = null;

window.addEventListener('touchstart', function(e) {
 const card = e.target.closest('.member-entry');
 if (card) {
   const idMatch = card.id.match(/\d+/);
   if (idMatch) {
     const idx = parseInt(idMatch[0]);
     if (touchTimer) clearTimeout(touchTimer);
     touchTimer = setTimeout(() => {
       triggerNameChange(idx);
     }, 800);
   }
 }
}, { passive: true });

window.addEventListener('touchend', function() {
 if (touchTimer) clearTimeout(touchTimer);
});
window.addEventListener('touchmove', function() {
 if (touchTimer) clearTimeout(touchTimer);
});

window.addEventListener('contextmenu', function(e) {
 const card = e.target.closest('.member-entry');
 if (card) {
   e.preventDefault(); 
   const idMatch = card.id.match(/\d+/);
   if (idMatch) {
     triggerNameChange(parseInt(idMatch[0]));
   }
 }
});

function triggerNameChange(idx) {
 if (touchTimer) clearTimeout(touchTimer);
 let currentName = membersData[idx].name;
 let newName = prompt(`Spielernamen bearbeiten:`, currentName);
 if (newName !== null && newName.trim() !== "") {
   membersData[idx].name = newName.trim();
   const nameDisp = document.getElementById(`name-display-${idx}`);
   if (nameDisp) nameDisp.innerText = newName.trim();
   logHistory(`Spieler umbenannt in: ${newName.trim()}`);
 }
}

// VERBINDUNGS-HANDLER (Zentralisierte Funktion)
// =========================================================================
async function connectToGranBoard() {
    const statusBox = document.getElementById('btStatusBox');
    if (!statusBox) return;

    try {
        statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Suche Board...';
        statusBox.style.borderColor = "var(--accent-gold)";
        statusBox.style.color = "var(--accent-gold)";

        const device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [GRANBOARD_SERVICE_UUID.toLowerCase()] }]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(GRANBOARD_SERVICE_UUID.toLowerCase());
        const characteristic = await service.getCharacteristic(GRANBOARD_CHAR_UUID.toLowerCase());
        
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', (e) => {
            let value = e.target.value;
            let uint8Array = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
            let rawString = new TextDecoder().decode(uint8Array);
            let cleanString = rawString.replace(/[@\r\n]/g, '').trim();
            
            console.log("Signal vom Board erhalten:", `"${cleanString}"`);
            
            if (EXACT_BOARD_MATRIX[cleanString]) {
                processHit(cleanString);
            } else if (cleanString === "OUT" || cleanString === "MISS" || cleanString === "" || cleanString === "M" || cleanString === "O" || cleanString.includes("0.0")) {
                console.log("Vorbeisensor erkannt (OUT) -> Übergebe 'MISS' an Spiellogik.");
                processHit("MISS");
            } else {
                console.warn(`Unbekannter Sensor-Code: "${cleanString}"`);
            }
        });

        // ERFOLGFALL -> Button wird GRÜN
        statusBox.className = "bt-status connected";
        statusBox.style.borderColor = "var(--accent-green)";
        statusBox.style.color = "var(--accent-green)";
        statusBox.innerHTML = '<i class="fa-solid fa-toggle-on"></i> Board Aktiv';
        logHistory("GranBoard erfolgreich via Bluetooth verbunden!");

        // Überwachung für plötzliche Verbindungsabbrüche
        device.addEventListener('gattserverdisconnected', onDisconnected);

    } catch (err) {
        console.error(err);
        // FEHLERFALL / ABBRUCH -> Button wird ROT
        onDisconnected();
        alert("Bluetooth-Verbindung fehlgeschlagen. Tastatur-Simulation aktiv: Drücke die Tasten 1-9 oder 'B'.");
    }
}

// Hilfsfunktion wenn das Board getrennt wird oder die Suche fehlschlägt
function onDisconnected() {
    const statusBox = document.getElementById('btStatusBox');
    if (statusBox) {
        statusBox.className = "bt-status";
        statusBox.style.borderColor = "#ff3333";
        statusBox.style.color = "#ff3333";
        statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Erst Board suchen';
    }
}

// Event-Listener für den manuellen Connect-Button oben rechts im Menü
document.getElementById('btnConnect').addEventListener('click', connectToGranBoard);

// =========================================================================

        const container = document.getElementById('canvas3d-container');

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        dirLight.position.set(5, 5, 10);
        scene.add(dirLight);

        // Gruppen-Objekt für weiche Rotationsübergänge
        const boardGroup = new THREE.Group();
        scene.add(boardGroup);

        // Geometrien für die Dartscheibe generieren
        const boardBaseGeo = new THREE.CylinderGeometry(4, 4, 0.2, 40);
        const boardBaseMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
        const boardBase = new THREE.Mesh(boardBaseGeo, boardBaseMat);
        boardBase.rotation.x = Math.PI / 2;
        boardGroup.add(boardBase);

        // Zentrales Bullseye-Segment simulieren
        const innerBullGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.25, 20);
        const innerBullMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const innerBull = new THREE.Mesh(innerBullGeo, innerBullMat);
        innerBull.rotation.x = Math.PI / 2;
        innerBull.name = "seg-25";
        boardGroup.add(innerBull);

        camera.position.z = 8;
        // 3D Render-Loop für flüssige Bewegungen
        function animate() {
            requestAnimationFrame(animate);
            // Sanfte, moderne Idle-Rotation der Dartscheibe im Raum
            boardGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.03;
            renderer.render(scene, camera);
        }
        animate();

function animateSegmentHit(val, multiplier) {
    let prefix = "S";
    let textColor = "#00f0ff"; // Cyan für Single
    let shadowColor = "rgba(0,240,255,0.8)";

    if (multiplier === 2) {
        prefix = "D";
        textColor = "#39ff14"; // Neongrün für Double
        shadowColor = "rgba(57,255,20,0.8)";
    } else if (multiplier === 3) {
        prefix = "T";
        textColor = "#ffaa00"; // Goldgelb für Triple
        shadowColor = "rgba(255,170,0,0.8)";
    }

    // Spezialfall Bullseye / Fehlwurf
    let displayText = `${prefix}${val}`;
    if (val === 25) {
        displayText = multiplier === 2 ? "D-BULL" : "BULL";
        textColor = "#ff0055"; // Pink/Rot für Bull
        shadowColor = "rgba(255,0,85,0.8)";
    }
    if (val === 0) {
        displayText = "MISS";
        textColor = "#ff3333";
        shadowColor = "rgba(255,51,51,0.8)";
    }

    // Element im HTML erzeugen, falls es noch nicht existiert
    let popup = document.getElementById('hit-popup-element');
    if (!popup) {
        popup = document.createElement('div');
        popup.id = 'hit-popup-element';
        popup.className = 'hit-popup';
        document.body.appendChild(popup);
    }

    // Werte zuweisen und Animation starten
    popup.innerText = displayText;
    popup.style.color = textColor;
    popup.style.textShadow = `0 0 30px ${shadowColor}, 0 0 50px ${textColor}`;
    
    // Klasse hinzufügen zum Einblenden
    popup.classList.add('show');

    // Nach 1,2 Sekunden wieder ausblenden
    setTimeout(() => {
        popup.classList.remove('show');
    }, 1200);
}

// Automatische Anpassung der 3D-Ansicht bei Fenstergrößenänderung
window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function zeigeKassenAbrechnung() {
  // Falls die Abrechnung in einem Modal oder einem Alert-Bereich angezeigt wird, 
  // bauen wir hier eine dynamische Liste mit Lösch-Buttons pro Spieler.
  
  let html = `<div style="font-family:'Orbitron', sans-serif; color:#fff; padding:10px;">
                <h3 style="color:var(--accent-gold); margin-bottom:15px; text-transform:uppercase;">Kassen-Abrechnung</h3>
                <div style="display:flex; flex-direction:column; gap:10px; max-height:400px; overflow-y:auto;">`;
  
  let gesamtKasse = 0;

  activePlayers.forEach((p, idx) => {
    // Berechnung der Strafen (Misses: 0,20€, LowScores: 0,10€, Spielgebühr: 0,50€)
    let missesKosten = p.penalties.misses * 0.20;
    let lowKosten = p.penalties.lowScores * 0.10;
    let spielGebuehr = p.penalties.gamesCount * 0.50;
    let summeSpieler = missesKosten + lowKosten + spielGebuehr;
    gesamtKasse += summeSpieler;

    html += `
      <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); padding:8px 12px; border-radius:6px;">
        <div>
          <span style="font-weight:bold; color:var(--accent-cyan);">${p.name}</span><br>
          <span style="font-size:11px; color:#aaa;">Fehlwürfe: ${p.penalties.misses} | Low: ${p.penalties.lowScores} | Spiele: ${p.penalties.gamesCount}</span>
        </div>
        <div style="display:flex; align-items:center; gap:15px;">
          <span style="font-weight:900; color:var(--accent-green);">${summeSpieler.toFixed(2)} €</span>
          <!-- Der Lösch-Button für diesen einzelnen Spieler -->
          <button type="button" onclick="setzeSpielerStrafeZurueck(${idx})" style="background:#ff3333; color:#fff; border:none; border-radius:4px; padding:4px 8px; font-weight:bold; cursor:pointer; font-size:12px;">X</button>
        </div>
      </div>`;
  });

  html += `</div>
           <div style="margin-top:20px; padding-top:10px; border-top:2px solid var(--accent-cyan); text-align:right; font-size:18px; font-weight:900;">
             GESAMT: <span style="color:var(--accent-gold);">${gesamtKasse.toFixed(2)} €</span>
           </div>
           <button onclick="schliesseKassenModal()" class="btn-primary" style="margin-top:15px; width:100%; padding:10px;">Schließen</button>
           </div>`;

  // Hier wird das HTML in dein bestehendes Modal-Fenster injiziert
  // Falls du ein Standard-Overlay nutzt, passen wir das hier an dein System an:
  const modalBody = document.getElementById('members-list'); // Temporäre Nutzung des großen Modals für die Anzeige
  if(modalBody) {
    document.getElementById('player-selection-modal').classList.add('open');
    modalBody.innerHTML = html;
  }
}

// Hilfsfunktion zum Schließen des Abrechnungsfensters
function schliesseKassenModal() {
  document.getElementById('player-selection-modal').classList.remove('open');
  renderMembersListSidebar(); // Setzt die normale Spielerliste wieder zurück
}




// Setzt die Strafen für einen einzelnen Spieler per Knopfdruck zurück
function setzeSpielerStrafeZurueck(index) {
  if (activePlayers[index]) {
    const p = activePlayers[index];
    
    // Alle Zähler für die Strafkasse dieses Spielers auf 0 setzen
    p.penalties.misses = 0;
    p.penalties.lowScores = 0;
    p.penalties.gamesCount = 0;
    
    logHistory(`Kasse für ${p.name} ausgeglichen (auf 0 gesetzt).`);
    
    // Die Ansicht sofort aktualisieren, damit das Geld verschwindet
    zeigeKassenAbrechnung();
  }
}

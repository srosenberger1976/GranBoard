<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GranBoard 3D Training Pro</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Three.js für 3D Grafiken -->
    <script src="https://cloudflare.com"></script>


    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(22, 27, 46, 0.85);
            --accent-cyan: #00f0ff;
            --accent-green: #39ff14;
            --accent-gold: #ffaa00;
            --text-light: #f0f4f8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

body {
    font-family: 'Rajdhani', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
    height: 100vh;
    overflow: hidden;
    display: block;
    position: relative;
}

/* --- 3D CANVAS BACKGROUND --- */
#canvas3d-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    background: radial-gradient(circle at center, #1b223c 0%, #07090f 100%);
    z-index: 1;
}

.sidebar {
 position: fixed;
 top: 0; 
 left: 0; /* ÄNDERUNG: Startet jetzt direkt geöffnet im Bild! */
 width: 380px;
 height: 100vh;
 background: rgba(10, 14, 28, 0.95);
 border-right: 2px solid var(--accent-cyan);
 padding: 20px;
 display: flex;
 flex-direction: column;
 gap: 15px;
 overflow-y: auto;
 backdrop-filter: blur(15px);
 box-shadow: 10px 0 30px rgba(0,0,0,0.7);
 transition: left 0.4s ease-in-out;
 z-index: 200;
}


.sidebar.open {
    left: 0;
}

.settings-toggle-btn {
 position: absolute;
 top: 25px; 
 left: 405px; /* Bleibt rechts neben der Sidebar */
 width: auto; /* Wächst automatisch mit dem Text mit */
 height: auto;
 background: rgba(22, 27, 46, 0.9);
 border: 2px solid var(--accent-cyan);
 color: var(--accent-cyan);
 border-radius: 6px; /* Schön abgerundete Ecken statt Kreis */
 padding: 10px 18px; /* Innenabstand für den Text */
 display: flex; align-items: center; justify-content: center;
 gap: 8px; /* Abstand zwischen dem Zahnrad und dem Wort "MENÜ" */
 font-family: 'Orbitron', sans-serif;
 font-size: 16px; 
 font-weight: bold;
 letter-spacing: 1px;
 cursor: pointer; pointer-events: auto;
 box-shadow: 0 0 15px rgba(0,240,255,0.3);
 transition: all 0.3s;
 z-index: 150;
}


.settings-toggle-btn:hover {
    transform: rotate(45deg) scale(1.1);
    box-shadow: 0 0 25px var(--accent-cyan);
}


        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }



@keyframes pulse {
    from { opacity: 0.4; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1.1); }
}


        h1 {
            font-size: 20px;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0,240,255,0.4);
            text-align: center;
            margin-bottom: 10px;
        }

        .section-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
        }

        .section-title {
            font-size: 14px;
            color: var(--accent-gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Elements */
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        select, input, button {
            width: 100%;
            background: #111424;
            border: 1px solid #2d3559;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        select:focus, input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0,240,255,0.3);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #0055ff 0%, #00d2ff 100%);
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,210,255,0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #009900 0%, #39ff14 100%);
            border: none; color: #000; font-weight: bold; cursor: pointer;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Members / Player Selection */
        .member-entry {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }
        .member-checkbox { width: auto; margin: 0; }

        /* --- OVERLAYS ON 3D CANVAS --- */
        .hud-overlay {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            padding: 25px;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bt-status {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ff3333;
            color: #ff3333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bt-status.connected {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 10px rgba(57,255,20,0.3);
        }

        /* Giant Scoreboard for current player */
        .main-score-panel {
            background: rgba(5, 7, 15, 0.8);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-width: 250px;
            box-shadow: 0 0 30px rgba(0,240,255,0.2);
        }
        .active-player-name {
            font-size: 24px;
            color: #fff;
            font-weight: bold;
        }
        .giant-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            color: var(--accent-green);
            text-shadow: 0 0 20px rgba(57,255,20,0.5);
            line-height: 1;
            margin: 10px 0;
        }

        /* Darts Thrown in current Turn */
        .dart-turn-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .dart-icon {
            font-size: 20px;
            color: #444;
            text-shadow: none;
            transition: all 0.3s;
        }
        .dart-icon.active {
            color: var(--accent-gold);
            text-shadow: 0 0 8px var(--accent-gold);
        }

        /* Banner for Next Player / Pull Darts */
        #action-banner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff0055 0%, #990000 100%);
            padding: 20px 50px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            border: 3px solid #ff3333;
            box-shadow: 0 0 40px rgba(255,0,85,0.6);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        #action-banner.show { transform: translate(-50%, -50%) scale(1); }

        /* Player Rotation Grid at bottom */
        .hud-bottom {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            width: 100%;
        }
        .player-card {
            background: rgba(10,15,30,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 6px;
            min-width: 140px;
            text-align: center;
            transition: all 0.3s;
        }
        .player-card.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0,240,255,0.3);
            transform: translateY(-5px);
        }
        .player-card .p-name { font-weight: bold; font-size: 16px; }
        .player-card .p-score { font-family: 'Orbitron', sans-serif; color: var(--accent-cyan); font-size: 20px; }
   

/* Riesiges Treffer-Pop-up mit solidem Kasten-Hintergrund */
.hit-popup {
 position: fixed;
 top: 50%;
 left: 50%;
 /* Startzustand: Nach unten verschoben, klein und unsichtbar */
 transform: translate(-50%, -20%) scale(0.1);
 font-family: 'Orbitron', sans-serif;
 font-size: 200px; /* Perfekte Größe, damit der Kasten nicht den ganzen Bildschirm blockiert */
 font-weight: 900;
 color: #39ff14; /* Pures, sattes Neongrün */
 
 /* DER KASTEN: Komplett blickdicht (0.95), extrem dunkel mit Cyberpunk-Rahmen */
 background: rgba(5, 7, 15, 0.98); 
 border: 4px solid #00f0ff; /* Stechender, cyanfarbener Rahmen */
 border-radius: 20px;
 padding: 20px 60px;
 min-width: 450px;
 text-align: center;
 
 /* Extreme Leuchteffekte für Rahmen und Text für maximale Sichtbarkeit */
 box-shadow: 0 0 50px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3);
 text-shadow: 0 0 25px rgba(57, 255, 20, 1), 0 0 50px rgba(57, 255, 20, 0.8);
 
 z-index: 99999; /* Überlagert absolut alles */
 pointer-events: none;
 opacity: 0;
 transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Zielzustand: Schießt voll deckend in den Fokus */
.hit-popup.show {
 opacity: 1 !important;
 transform: translate(-50%, -50%) scale(1);
}




/* --- OVERLAY FENSTER FÜR SPIELERAUSWAHL --- */
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(5, 7, 15, 0.85);
    backdrop-filter: blur(8px);
    display: none; /* Standardmäßig unsichtbar */
    justify-content: center; align-items: center;
    z-index: 2000;
}
.modal-overlay.open { display: flex; }
.modal-content {
    background: rgba(10, 14, 28, 0.99); /* Dunkler, edler Cyberpunk-Hintergrund */
    border: 3px solid var(--accent-cyan);
    box-shadow: 0 0 50px rgba(0,240,255,0.5);
    border-radius: 16px;
    width: 95vw; /* Nutzt 95% der gesamten Bildschirmbreite */
    height: 90vh; /* Nutzt 90% der gesamten Bildschirmhöhe */
    max-height: 90vh;
    padding: 35px;
    display: flex; 
    flex-direction: column;
    font-family: 'Orbitron', sans-serif;
}

.modal-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 12px; margin-bottom: 15px;
}
.modal-body {
 overflow-y: auto;
 flex-grow: 1;
 padding-right: 5px;
 margin-bottom: 20px;
}

.open-targets-hint {
 font-size: 2vw; /* Passt sich der Bildschirmbreite an */
 min-font-size: 16px; /* Verhindert, dass es auf sehr kleinen Handys unlesbar klein wird */
 color: var(--accent-cyan);
 opacity: 0.95;
 margin-top: 1vh;
 text-align: left;
 letter-spacing: 1px;
}
.open-targets-hint strong {
 color: var(--accent-gold);
 text-shadow: 0 0 10px rgba(255,170,0,0.3);
}
/* Klasse für Zahlen, die bei allen Gegnern bereits zu sind */
.target-blocked {
 color: #ff3333 !important;
 text-shadow: 0 0 10px rgba(255,51,51,0.5) !important;
 text-decoration: line-through;
}



/* 1. Blinkender Neon-Pfeil (für Soft Cricket) */
.active-arrow-neon {
 display: inline-block;
 font-size: 3.5vw;
 color: var(--accent-cyan);
 margin-left: 15px;
 vertical-align: middle;
 text-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
 animation: neonBlink 1s ease-in-out infinite alternate;
}
@keyframes neonBlink {
 0% { opacity: 0.2; text-shadow: 0 0 2px var(--accent-cyan); }
 100% { opacity: 1; text-shadow: 0 0 15px var(--accent-cyan), 0 0 25px #00f0ff; }
}

/* 2. Animiertes 3D-Monster (für Monster Cricket) */
.monster-icon-3d {
 display: inline-block;
 font-size: 4.5vw;
 margin-left: 15px;
 vertical-align: middle;
 filter: drop-shadow(0 0 15px #ff0055);
 animation: monsterBreath 3s ease-in-out infinite alternate, monsterFloat 4s ease-in-out infinite alternate;
 transform-style: preserve-3d;
 perspective: 500px;
}
@keyframes monsterBreath {
 0% { transform: scale(1) rotateX(0deg) rotateY(0deg); filter: drop-shadow(0 0 10px #ff0055); }
 100% { transform: scale(1.12) rotateX(10deg) rotateY(-5deg); filter: drop-shadow(0 0 25px #ffaa00); }
}
@keyframes monsterFloat {
 0% { transform: translateY(0px); }
 100% { transform: translateY(-8px); }
}



/* Split Score Explosionsoverlay */
/* Split Score Explosionsoverlay - WUCHTIGER & LANGSAMER */
.split-explosion-overlay {
 position: fixed;
 top: 0; left: 0;
 width: 100vw; height: 100vh;
 background: rgba(20, 0, 5, 0.93); /* Dunkler, damit die Zahl extrem heraussticht */
 display: flex; justify-content: center; align-items: center;
 z-index: 9999;
 backdrop-filter: blur(25px); /* Stärkerer Weichzeichner im Hintergrund */
 font-family: 'Orbitron', sans-serif;
 pointer-events: none;
 animation: flashBackground 2.0s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
}
.explosion-number {
 font-size: 8vw; /* Etwas kompakter, damit der Text garantiert nicht abschneidet */
 font-weight: 900;
 color: #ff2233;
 text-align: center;
 line-height: 1.2;
 text-shadow: 0 0 30px #ff0044, 0 0 60px #ff0044, 0 0 100px #ff0044;
 animation: shatterText 2.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes flashBackground {
 0% { background: rgba(255, 0, 40, 0.85); }
 15% { background: rgba(15, 3, 8, 0.95); }
 90% { opacity: 1; }
 100% { opacity: 0; } /* Blendet am Ende weich aus */
}
@keyframes shatterText {
 0% { transform: scale(0.2) rotate(-5deg); opacity: 0; }
 10% { transform: scale(1.2) rotate(3deg); opacity: 1; }
 20% { transform: scale(1.0) rotate(0deg); }
 75% { transform: scale(1.15) rotate(1deg); opacity: 1; filter: blur(0px); }
 100% { transform: scale(1.8); opacity: 0; filter: blur(20px); }
}


/* Blinkender Team-Sperrhinweis */
.team-lock-warning {
    background: rgba(255, 0, 0, 0.2);
    border: 2px solid #ff3333;
    color: #ff3333;
    padding: 10px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin-top: 15px;
    text-shadow: 0 0 10px #ff3333;
    animation: lockFlash 0.6s infinite alternate;
}
@keyframes lockFlash {
    0% { opacity: 0.3; box-shadow: 0 0 5px rgba(255,51,51,0.2); }
    100% { opacity: 1; box-shadow: 0 0 20px rgba(255,51,51,0.6); }
}



</style>
</head>









<body>
<!-- BESCHRIFTETER MENÜ-TRIGGERKNOPF (RECHTSBÜNDIG) -->
<div class="settings-toggle-btn" onclick="toggleSettingsMenu()" style="position: absolute; top: 20px; right: 30px; left: auto; background: rgba(0, 240, 255, 0.1); border: 2px solid var(--accent-cyan); color: var(--accent-cyan); padding: 10px 24px; font-family: 'Orbitron'; font-weight: 900; font-size: 16px; border-radius: 8px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); transition: all 0.3s ease; z-index: 1000; width: auto; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.background='rgba(0, 240, 255, 0.25)'; this.style.boxShadow='0 0 25px rgba(0, 240, 255, 0.5)';" onmouseout="this.style.background='rgba(0, 240, 255, 0.1)'; this.style.boxShadow='0 0 15px rgba(0, 240, 255, 0.2)';">
  <i class="fa-solid fa-gear"></i> MENÜ
</div>



 <!-- DIE SIDEBAR -->
 <!-- DIE SIDEBAR -->
 <div class="sidebar open" id="sliding-settings-menu">

 <!-- Schließen-Knopf im Untermenü -->
 <button style="background:#ff3333; margin-bottom: 5px; color:#fff;" onclick="toggleSettingsMenu()">
 <i class="fa-solid fa-xmark"></i> Einstellungen schließen
 </button>
 
 <!-- DIE SIDEBAR INHALTE -->
 <h1><i class="fa-solid fa-crosshairs"></i> GranBoard 3D</h1>
 
 <!-- 1. BOARD VERBINDEN -->
 <button id="btnConnect" class="btn-primary">
   <strong>1.</strong> <i class="fa-solid fa-bluetooth"></i> Board Verbinden
 </button>

 <!-- 2. SPIELER AUSWÄHLEN (Hierher verschoben!) -->
 <div class="section-box" style="margin-bottom: 15px;">
   <div class="section-title"><i class="fa-solid fa-users"></i> Trainingsteilnehmer</div>
   <button type="button" onclick="openPlayerModal()" style="width: 100%; background: linear-gradient(135deg, #111424 0%, #1b223c 100%); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: bold; padding: 12px; cursor: pointer; box-shadow: 0 0 10px rgba(0,240,255,0.1); margin-bottom: 0; font-family: 'Orbitron'; font-size: 13px;">
     <strong>2.</strong> <i class="fa-solid fa-user-gear"></i> SPIELER AUSWÄHLEN 👥
   </button>

 <!-- UPGRADED SETUP PANEL -->

   <div id="x01-options">

       <option value="301">301</option>

       <option value="701">701</option>
       <option value="1001">1001</option>
     </select>
     <label>Einwurf (In)</label>
     <select id="x01-in">
       <option value="open">Open In</option>
       <option value="double">Double In</option>

     <strong>3.</strong> Spieler wählen
   </button>
 </div>


 
 <!-- WURF-LIVE-LOG -->
 <div class="section-box" style="flex-grow:1; display:flex; flex-direction:column;">

 Warte auf Trainingsstart...

 </div>

 <!-- DAS MULTI-DISPLAY FÜR UNTEREINANDER (CRICKET & SPLIT SCORE) -->

 <div style="height: 20px;"></div>
 <div class="hud-bottom" id="hud-players-rotation" style="display:none;"></div>
 </div>
 </div>




 <!-- DAS NEUE OVERLAY-FENSTER (JETZT IM ECHTEN VOLLBILD-LOOK) -->
 <div class="modal-overlay" id="player-selection-modal">
     <div class="modal-content">
         <div class="modal-header">
             <h2 style="font-size: 24px; color: var(--accent-gold); margin: 0;"><i class="fa-solid fa-users-gear"></i> Wer spielt heute mit?</h2>
             <button type="button" onclick="closePlayerModal()" style="width: auto; background: transparent; border: none; color: #ff3333; font-size: 28px; cursor: pointer; margin: 0; padding: 0 5px;"><i class="fa-solid fa-xmark"></i></button>
         </div>

     const checkbox = document.getElementById(`mem-${idx}`);
     const visualBox = document.getElementById(`visual-box-${idx}`);
     const statusDot = document.getElementById(`status-dot-${idx}`);
     const textInput = document.getElementById(`name-${idx}`);
     
     if (!checkbox || !visualBox || !statusDot) return;
     
     // Zustand der unsichtbaren Checkbox umdrehen
     checkbox.checked = !checkbox.checked;
     
     // Farben live im Browser anpassen
     if (checkbox.checked) {
         visualBox.style.background = "rgba(57, 255, 20, 0.15)";
         visualBox.style.border = "2px solid var(--accent-green)";
         visualBox.style.boxShadow = "0 0 15px rgba(57,255,20,0.4)";
         statusDot.style.color = "var(--accent-green)";
         statusDot.innerText = "✓";
         if (textInput) textInput.style.textShadow = "0 0 10px rgba(57,255,20,0.6)";
     } else {
         visualBox.style.background = "rgba(255,255,255,0.02)";
         visualBox.style.border = "1px solid rgba(255,255,255,0.1)";
         visualBox.style.boxShadow = "none";
         statusDot.style.color = "#444";
         statusDot.innerText = "●";
         if (textInput) textInput.style.textShadow = "none";

// ERWEITERTES TRAINING-SETUP MIT DOPPEL-FUNKTION (KORRIGIERT)
function initTrainingSession() {
 activePlayers = [];
 currentSessionMode = document.getElementById('game-mode').value;
 
  for(let i = 0; i < membersData.length; i++) {
    const cb = document.getElementById(`mem-${i}`);
    const nameInput = document.getElementById(`name-${i}`);
    
    // NEU: Holt das vom Nutzer frei gewählte Team aus dem Dropdown
    const teamDropdown = document.getElementById(`team-select-${i}`);
    let zugewiesenesTeam = teamDropdown ? parseInt(teamDropdown.value) : 1;
    
    if(cb && cb.checked) {
      let pName = nameInput.value.trim() || `Spieler ${i+1}`;
      let startScore = 501;
      
      // Greift auch bei der neuen Team-ID 'x01_teams'
      if(currentSessionMode === 'x01' || currentSessionMode === 'x01_teams') {
        startScore = parseInt(document.getElementById('x01-target').value);
      }
      if(currentSessionMode === 'split') startScore = 40;
      if(currentSessionMode === 'cricket' || currentSessionMode === 'maxicricket') startScore = 0;
      
      activePlayers.push({
        memberId: i,
        name: pName,
        score: startScore,
        totalDarts: 0,
        team: zugewiesenesTeam, // Nutzt dein manuell gesetztes Team!
        cricketHits: (currentSessionMode === 'maxicricket') ? 
        {10:0,11:0,12:0,13:0,14:0,15:0,16:0,17:0,18:0,19:0,20:0,25:0} : 
        {15:0,16:0,17:0,18:0,19:0,20:0,25:0}
      });
    }
  }
 
 if(activePlayers.length === 0) { return alert("Bitte wähle mindestens 1 Mitglied aus!"); }
 currentPlayerIdx = 0; dartsThrownThisTurn = 0;
 isProcessingTurnChange = false;
 
 // Schaltet das Standard-Scoreboard komplett ab, wir nutzen nur noch das große Multi-Display!

 const menu = document.getElementById('sliding-settings-menu');
 if (menu) {

 menu.classList.remove('open');
 }
 
 logHistory(`=== Training gestartet: ${currentSessionMode.toUpperCase()} ===`);
}

 soundFile = localStorage.getItem('mkk_sound_double') || 'Doppel-lauter.wav';
 } else {
 soundFile = localStorage.getItem('mkk_sound_single') || 'Einfach-pip.wav';
 }

 if (soundFile !== "") {
 const audio = new Audio(soundFile);
 audio.play().catch(e => console.log("Audio blockiert:", e));
 }
// Deutsche Sprachausgabe (Wird auf GitHub automatisch stummgeschaltet!)
if (!isX01Bust && p.score !== 0) {
  if (window.location.hostname.includes('github.io')) {
    console.log("GitHub Pages erkannt: Sprachausgabe unterdrückt, nutze nur WAV-Dateien.");
  } else {
    let speechText = "";
    if (hit.v === 0) speechText = "Fehlwurf";
    else if (hit.v === 25) speechText = hit.m === 2 ? "Doppel Bull" : "Bullseye";
    else {
      let prefixText = hit.m === 3 ? "Dreifach " : (hit.m === 2 ? "Doppel " : "");
      speechText = `${prefixText}${hit.v}`;
    }
    const utterance = new SpeechSynthesisUtterance(speechText);
    utterance.lang = 'de-DE';
    utterance.rate = 1.25; 
    window.speechSynthesis.speak(utterance);
  }
}
} catch(audioErr) {
  console.error("Audio-Fehler in Spiellogik:", audioErr);
}
 }

 // Punkte vor dem ersten Wurf merken (für potenziellen Bust)
 if (dartsThrownThisTurn === 1) {
 p.scoreAtStartOfTurn = (currentSessionMode === 'x01' || currentSessionMode === 'x01_teams') ? (p.score + points) : p.score;
 }
 
 logHistory(`${p.name}: ${hit.t} ${hit.v} (${points} Pkt)`);
 
 // Display aktualisieren
 updateHud();

 // --- RUNDENENDE PRÜFEN ---
 if (dartsThrownThisTurn >= 3) { 
 if (currentSessionMode === 'split') {
 const mindestPfeile = parseInt(document.getElementById('split-start')?.value) || 12;
 if (!p.roundHitsThisTurn || p.roundHitsThisTurn === 0) {
 if (p.totalDarts > mindestPfeile) {
 const altePunktzahl = p.score;
 p.score = Math.round(p.score / 2);
 
 const exploContainer = document.createElement('div');
 exploContainer.className = 'split-explosion-overlay';
 exploContainer.innerHTML = `<div class="explosion-number">${altePunktzahl}<br><span style="font-size:4vw; color:#fff;"> ZERPLATZT AUF ${p.score} </span></div>`;
 document.body.appendChild(exploContainer);
 
 setTimeout(() => { exploContainer.remove(); }, 2000);
 logHistory(` Keine Treffer! ${p.name} fällt auf ${p.score}`);
 } else {
 logHistory(` Keine Treffer, aber geschützt vor Pfeil ${mindestPfeile}`);
 }
 }
 p.roundHitsThisTurn = 0;
 }
 
 triggerTurnChange(); 
 }
}







function triggerTurnChange() {
  // HIER ALS ERSTE ZEILE EINFÜGEN:
  let changeSound = localStorage.getItem('mkk_sound_change') || 'spielerwechsel.wav';
  new Audio(changeSound).play().catch(e => {});

  isProcessingTurnChange = true;
  showBanner("PFEILE RAUSZIEHEN!");

            
            setTimeout(() => {
                dartsThrownThisTurn = 0;
                // Zum nächsten Spieler wechseln (rotiert bei Erreichen des Endes automatisch zu Spieler 1)
                currentPlayerIdx = (currentPlayerIdx + 1) % activePlayers.length;
                
                hideBanner();
                isProcessingTurnChange = false;
                updateHud();

                // AUTOMATISCHES NACHRÜCKEN/SCROLLEN:
                // Findet die Zeile des neuen Spielers und scrollt sie perfekt in die Mitte des Bildschirms
                setTimeout(() => {
                    const nextPlayerRow = document.getElementById(`player-row-${currentPlayerIdx}`);
                    const scrollContainer = document.getElementById('cricket-rows-container');
                    
                    if (nextPlayerRow && scrollContainer) {
                        // Wenn Spieler 1 (Index 0) wieder dran ist, scrollen wir radikal ganz nach oben
                        if (currentPlayerIdx === 0) {
                            scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
                        } else {
                            // Ansonsten zentrieren wir den aktiven Spieler sanft im Sichtfeld
                            nextPlayerRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }, 50);

            }, 4000); // 4 Sekunden Pause zum Pfeile holen
        }


        // Blendet das große Info-Banner über dem 3D-Feld ein
        function showBanner(text) {
            const banner = document.getElementById('action-banner');
            banner.innerText = text;
            banner.classList.add('show');
        }

        // Blendet das Info-Banner wieder aus
        function hideBanner() {
            document.getElementById('action-banner').classList.remove('show');
        }

        // Schreibt Einträge in das Protokoll-Fenster der Wurfhistorie
        function logHistory(text) {
            const logBox = document.getElementById('history-log');
            logBox.innerHTML = `<div>${text}</div>` + logBox.innerHTML;
        }
        // Verbindungs-Handler für das native Bluetooth-System des GranBoards
        document.getElementById('btnConnect').addEventListener('click', async () => {
            const statusBox = document.getElementById('btStatusBox');
            try {
                statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Suche Board...';
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [GRANBOARD_SERVICE_UUID.toLowerCase()] }]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(GRANBOARD_SERVICE_UUID.toLowerCase());
                const characteristic = await service.getCharacteristic(GRANBOARD_CHAR_UUID.toLowerCase());

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
    let value = e.target.value;
    
    // Bytes in Text umwandeln
    let uint8Array = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
    let rawString = new TextDecoder().decode(uint8Array);
    
    // Entfernt @, Zeilenumbrüche und Leerzeichen
    let cleanString = rawString.replace(/[@\r\n]/g, '').trim();
    
    console.log("👉 Signal vom Board erhalten:", `"${cleanString}"`);

    // 1. Regulärer Treffer aus der Matrix (z.B. ein Segment auf dem Board)
    if (EXACT_BOARD_MATRIX[cleanString]) {
        processHit(cleanString);
    } 
    // 2. ERWEITERTER SENSOR-SCHUTZ: Fängt jetzt auch das "OUT"-Signal deines Boards ab!
    else if (cleanString === "OUT" || cleanString === "MISS" || cleanString === "" || cleanString === "M" || cleanString === "O" || cleanString.includes("0.0")) {
        console.log("🎯 Vorbeisensor erkannt (OUT) -> Übergebe 'MISS' an Spiellogik.");
        processHit("MISS");
    } 
    // 3. Unbekanntes Signal
    else {
        console.warn(`⚠️ Unbekannter Sensor-Code: "${cleanString}"`);
    }
});


                statusBox.className = "bt-status connected";
                statusBox.innerHTML = '<i class="fa-solid fa-toggle-on"></i> Board Aktiv';
                logHistory("GranBoard erfolgreich via Bluetooth verbunden!");
            } catch (err) {
                console.error(err);
                statusBox.className = "bt-status";
                statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Fehler';
                alert("Bluetooth-Verbindung fehlgeschlagen. Tastatur-Simulation aktiv: Drücke die Tasten 1-9 für Single-Treffer auf dem Keyboard oder 'B' für Bullseye.");
            }
        });

        // Tastatur-Simulation für Testläufe ohne echte Dartscheibe
        window.addEventListener('keydown', (e) => {
            if(!isNaN(e.key) && e.key !== ' ' && e.key !== '0') {
                processHit(`${e.key}.1`); // Simuliert Single-Treffer der entsprechenden Zahl
            }
            if(e.key.toLowerCase() === 'b') {
                processHit("8.0"); // Simuliert ein Single Bull
            }
        });
        // ==========================================
        // 4. ANIMIERTES 3D DARTBOARD (THREE.JS CORES)
        // ==========================================
        const container = document.getElementById('canvas3d-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lichtquellen für realistische Schattierung
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 5, 10);
        scene.add(dirLight);

        // Gruppen-Objekt für weiche Rotationsübergänge
        const boardGroup = new THREE.Group();
        scene.add(boardGroup);

        // Geometrien für die Dartscheibe generieren
        const boardBaseGeo = new THREE.CylinderGeometry(4, 4, 0.2, 40);
        const boardBaseMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
        const boardBase = new THREE.Mesh(boardBaseGeo, boardBaseMat);
        boardBase.rotation.x = Math.PI / 2;
        boardGroup.add(boardBase);

        // Zentrales Bullseye-Segment simulieren
        const innerBullGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.25, 20);
        const innerBullMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const innerBull = new THREE.Mesh(innerBullGeo, innerBullMat);
        innerBull.rotation.x = Math.PI / 2;
        innerBull.name = "seg-25";
        boardGroup.add(innerBull);

        camera.position.z = 8;
        // 3D Render-Loop für flüssige Bewegungen
        function animate() {
            requestAnimationFrame(animate);
            // Sanfte, moderne Idle-Rotation der Dartscheibe im Raum
            boardGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.03;
            renderer.render(scene, camera);
        }
        animate();

function animateSegmentHit(val, multiplier) {
    let prefix = "S";
    let textColor = "#00f0ff"; // Cyan für Single
    let shadowColor = "rgba(0,240,255,0.8)";

    if (multiplier === 2) {
        prefix = "D";
        textColor = "#39ff14"; // Neongrün für Double
        shadowColor = "rgba(57,255,20,0.8)";
    } else if (multiplier === 3) {
        prefix = "T";
        textColor = "#ffaa00"; // Goldgelb für Triple
        shadowColor = "rgba(255,170,0,0.8)";
    }

    // Spezialfall Bullseye / Fehlwurf
    let displayText = `${prefix}${val}`;
    if (val === 25) {
        displayText = multiplier === 2 ? "D-BULL" : "BULL";
        textColor = "#ff0055"; // Pink/Rot für Bull
        shadowColor = "rgba(255,0,85,0.8)";
    }
    if (val === 0) {
        displayText = "MISS";
        textColor = "#ff3333";
        shadowColor = "rgba(255,51,51,0.8)";
    }

    // Element im HTML erzeugen, falls es noch nicht existiert
    let popup = document.getElementById('hit-popup-element');
    if (!popup) {
        popup = document.createElement('div');
        popup.id = 'hit-popup-element';
        popup.className = 'hit-popup';
        document.body.appendChild(popup);
    }

    // Werte zuweisen und Animation starten
    popup.innerText = displayText;
    popup.style.color = textColor;
    popup.style.textShadow = `0 0 30px ${shadowColor}, 0 0 50px ${textColor}`;
    
    // Klasse hinzufügen zum Einblenden
    popup.classList.add('show');

    // Nach 1,2 Sekunden wieder ausblenden
    setTimeout(() => {
        popup.classList.remove('show');
    }, 1200);
}

// Automatische Anpassung der 3D-Ansicht bei Fenstergrößenänderung
window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
